<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a photo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --cream: #fdf9f2;
    --paper: #ffffff;
    --ink: #4b3d36;
    --ink-soft: #8a7a70;
    --accent: #b3572a;
    --line: #eadfd3;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell{ max-width: 460px; margin: 0 auto; padding: 24px 20px 64px; }

  .top{ display: flex; align-items: center; justify-content: space-between; }
  .brand{ font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .swap{
    font-size: 13px; color: var(--ink-soft); text-decoration: none;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--paper);
  }
  .swap:hover{ color: var(--accent); border-color: var(--accent); }

  .title{ margin: 30px 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .sub{ margin: 0 0 26px; font-size: 15px; color: var(--ink-soft); line-height: 1.5; }

  .picker{
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 210px; border: 2px dashed var(--line); border-radius: 18px;
    background: var(--paper); cursor: pointer; overflow: hidden;
    text-align: center; transition: border-color 0.2s ease;
  }
  .picker:hover{ border-color: var(--accent); }
  .picker input{ position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .picker .icon{ font-size: 34px; line-height: 1; }
  .picker .hint{ font-size: 14px; color: var(--ink-soft); }
  .picker img.preview{
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }
  .picker.has .droppable{ display: none; }
  .picker.has img.preview{ display: block; }
  .picker.has{ border-style: solid; }

  .field{ margin-top: 18px; }
  .field label{ display: block; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field textarea{
    width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .field textarea{ min-height: 84px; resize: vertical; line-height: 1.4; }
  .field input:focus, .field textarea:focus{ outline: none; border-color: var(--accent); }
  .field .optional{ font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--line); font-size: 12px; }
  .field .hint{ margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }

  .send{
    margin-top: 26px; width: 100%; border: none; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 600; color: #fff;
    background: var(--accent); cursor: pointer; transition: opacity 0.2s ease;
  }
  .send:hover{ opacity: 0.9; }
  .send:disabled{ opacity: 0.5; cursor: default; }
  .send:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .status{ margin: 14px 0 0; min-height: 1.2em; text-align: center; font-size: 14px; color: var(--accent); }
  .status.error{ color: #b3002d; }
</style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <span class="brand">Polaroid wall</span>
      <a class="swap" href="receiver.html">View the wall &rarr;</a>
    </div>

    <h1 class="title">Send a photo</h1>
    <p class="sub">Snap or choose a picture. A note and a name are optional.</p>

    <div class="picker" id="picker">
      <input type="file" id="file" accept="image/*">
      <div class="droppable">
        <div class="icon">&#128247;</div>
        <div class="hint">Tap to take or pick a photo</div>
      </div>
      <img class="preview" id="preview" alt="Preview">
    </div>

    <div class="field">
      <label for="to">To <span class="optional">(optional)</span></label>
      <input type="text" id="to" autocomplete="off" placeholder="Name" maxlength="120">
    </div>
    <div class="field">
      <label for="message">Message <span class="optional">(optional)</span></label>
      <textarea id="message" placeholder="Something nice" maxlength="2000"></textarea>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" placeholder="Required to send">
      <p class="hint">Hint: 💚</p>
    </div>

    <button class="send" id="send" type="button">Send</button>
    <p class="status" id="status" role="status"></p>
  </div>

  <script src="config.js"></script>
  <script>
  (function(){
    var EP = (window.PHOTO_WALL_CONFIG || {}).endpoint || '';
    var picker = document.getElementById('picker');
    var fileEl = document.getElementById('file');
    var preview = document.getElementById('preview');
    var toEl = document.getElementById('to');
    var msgEl = document.getElementById('message');
    var pwEl = document.getElementById('password');
    var sendEl = document.getElementById('send');
    var statusEl = document.getElementById('status');

    var id = null;
    var base64 = null;

    function say(t, err){
      statusEl.textContent = t || '';
      statusEl.classList.toggle('error', !!err);
    }

    fileEl.addEventListener('change', function(){
      var f = fileEl.files && fileEl.files[0];
      if(!f){ return; }
      say('');
      compress(f).then(function(b64){
        base64 = b64;
        id = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
        preview.src = b64;
        picker.classList.add('has');
      }).catch(function(){
        say('Could not read that photo. Try another.', true);
      });
    });

    /* Downscale to keep the upload small enough for Apps Script and the
       wall fast to load. */
    function compress(file){
      return new Promise(function(resolve, reject){
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function(){
          URL.revokeObjectURL(url);
          var max = 1600;
          var w = img.naturalWidth, h = img.naturalHeight;
          var s = Math.min(1, max / Math.max(w, h));
          w = Math.max(1, Math.round(w * s));
          h = Math.max(1, Math.round(h * s));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode')); };
        img.src = url;
      });
    }

    function post(body){
      return fetch(EP, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(function(r){ return r.json(); });
    }

    sendEl.addEventListener('click', function(){
      if(!EP){ say('Add your endpoint to config.js first.', true); return; }
      if(!base64){ say('Pick a photo first.', true); return; }
      if(!pwEl.value.trim()){ say('Enter the password first.', true); return; }

      var raw = base64.replace(/^data:image\/\w+;base64,/, '');
      var body = {
        op: 'put',
        id: id,
        to: toEl.value.trim(),
        message: msgEl.value.trim(),
        image: raw,
        password: pwEl.value.trim()
      };

      sendEl.disabled = true;
      say('Sending…');
      post(body).then(function(res){
        if(res && res.ok){
          say('Sent!');
          fileEl.value = '';
          toEl.value = '';
          msgEl.value = '';
          id = null; base64 = null;
          preview.removeAttribute('src');
          picker.classList.remove('has');
        } else {
          if(res && res.error === 'bad password'){ say('That password is not right.', true); }
          else { say('Did not save — have another go.', true); }
        }
      }).catch(function(){
        say('Network error — have another go.', true);
      }).then(function(){
        sendEl.disabled = false;
      });
    });
  })();
  </script>
</body>
</html>
